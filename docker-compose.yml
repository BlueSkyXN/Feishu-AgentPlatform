services:
  feishu-agent-platform:
    build:
      context: .
    image: feishu-agent-platform:0.1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "7860"
      PUBLIC_HTTP_HOST: 0.0.0.0
      PUBLIC_HTTP_PORT: "7860"
      INTERNAL_HTTP_HOST: 127.0.0.1
      INTERNAL_HTTP_PORT: "8788"
      MODEL_BROKER_ENABLED: "true"
      MODEL_BROKER_HOST: 127.0.0.1
      MODEL_BROKER_PORT: "8790"
      MODEL_PROVIDER_POLICY: host-broker-only
      PLATFORM_CONFIG_ROOT: /app/config
      DATA_ROOT: /data/feishu-agent-platform
      PLATFORM_DATABASE_PATH: /data/feishu-agent-platform/platform.db
    ports:
      - "7860:7860"
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./skills:/app/skills:ro
      - ./vendor:/app/vendor:ro
      - platform-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7860/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  platform-data:
