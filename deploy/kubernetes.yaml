apiVersion: v1
kind: ConfigMap
metadata:
  name: feishu-agent-platform-config
data:
  app-primary.yaml: |
    id: primary
    appIdEnv: FEISHU_PRIMARY_APP_ID
    appSecretEnv: FEISHU_PRIMARY_APP_SECRET
    verificationTokenEnv: FEISHU_PRIMARY_VERIFICATION_TOKEN
    events:
      transport: websocket
    callbacks:
      transport: http
    policy:
      requireMention: true
      dmMode: open
    oauth:
      enabled: false
  agent-general.yaml: |
    id: general
    systemPromptFile: prompts/general.md
    provider: host-broker
    model: gpt-5.1
    modelApi: openai-responses
    upstreamPath: /openai
    runtime:
      isolation: process
    workspace:
      mode: read-only
    tools:
      feishu: [user.profile, chat.info, message.history, doc.read]
      workspace: [workspace.list, workspace.read, workspace.search]
    larkCli:
      enabled: false
      expectedVersion: 1.0.79
  binding-primary-general.yaml: |
    id: primary-general
    app: primary
    agent: general
    route:
      default: true
    conversation:
      scope: thread
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: feishu-agent-platform-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feishu-agent-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feishu-agent-platform
  template:
    metadata:
      labels:
        app: feishu-agent-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: platform
          image: your-registry/feishu-agent-platform:0.1.0
          ports:
            - name: public
              containerPort: 7860
          env:
            - {name: PUBLIC_HTTP_HOST, value: "0.0.0.0"}
            - {name: PUBLIC_HTTP_PORT, value: "7860"}
            - {name: INTERNAL_HTTP_HOST, value: "127.0.0.1"}
            - {name: INTERNAL_HTTP_PORT, value: "8788"}
            - {name: MODEL_BROKER_ENABLED, value: "true"}
            - {name: MODEL_BROKER_HOST, value: "127.0.0.1"}
            - {name: MODEL_BROKER_PORT, value: "8790"}
            - {name: MODEL_PROVIDER_POLICY, value: "host-broker-only"}
            - {name: PLATFORM_CONFIG_ROOT, value: "/app/config"}
            - {name: DATA_ROOT, value: "/data/feishu-agent-platform"}
            - {name: PLATFORM_DATABASE_PATH, value: "/data/feishu-agent-platform/platform.db"}
          envFrom:
            - secretRef:
                name: feishu-agent-platform-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /readyz, port: public}
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /healthz, port: public}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /healthz, port: public}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: config
          configMap:
            name: feishu-agent-platform-config
            items:
              - {key: app-primary.yaml, path: apps/primary.yaml}
              - {key: agent-general.yaml, path: agents/general.yaml}
              - {key: binding-primary-general.yaml, path: bindings/primary-general.yaml}
        - name: data
          persistentVolumeClaim:
            claimName: feishu-agent-platform-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: feishu-agent-platform
spec:
  selector:
    app: feishu-agent-platform
  ports:
    - name: http
      port: 80
      targetPort: public
