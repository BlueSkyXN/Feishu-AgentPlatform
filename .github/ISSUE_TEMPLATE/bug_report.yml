name: Bug report
description: 报告可复现的程序问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 App Secret、OAuth Token、Cloudflare Token、用户聊天内容或其他敏感数据。
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
      placeholder: 0.1.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署环境
      options:
        - Hugging Face Docker Space
        - Docker Compose
        - Kubernetes
        - systemd / 本地 Node.js
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: 使用脱敏配置和最小步骤。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: 确认
      options:
        - label: 我已删除凭据、Token、个人信息和真实聊天内容。
          required: true
