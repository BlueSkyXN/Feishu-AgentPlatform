name: Exact-head quality gate

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  source:
    name: Source / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact checked-out commit
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse 'HEAD^{commit}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run source checks, tests and build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npm run check 2>&1 | tee "artifacts/check-node-${{ matrix.node }}.log"
          npm run build 2>&1 | tee "artifacts/build-node-${{ matrix.node }}.log"
          npm run hf:preflight 2>&1 | tee "artifacts/hf-preflight-node-${{ matrix.node }}.log"
          npm run release:verify 2>&1 | tee "artifacts/release-verify-node-${{ matrix.node }}.log"

      - name: Upload source verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-verification-${{ inputs.source_sha }}-node-${{ matrix.node }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  production-image:
    name: Production image integration
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact checked-out commit
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse 'HEAD^{commit}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: feishu-agent-platform:quality-gate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image boundary and setup-mode HTTP smoke
        run: |
          set -euo pipefail
          image='feishu-agent-platform:quality-gate'
          container='feishu-agent-platform-quality-gate'
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 'node'
          docker image inspect "$image" \
            --format '{{json .Config.ExposedPorts}}' | grep -q '7860/tcp'
          if docker image inspect "$image" \
            --format '{{json .Config.ExposedPorts}}' | grep -Eq '22/tcp|8788/tcp|8790/tcp'; then
            echo 'Production image exposes a forbidden internal port.' >&2
            exit 1
          fi
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" \
            -p 127.0.0.1:17860:7860 \
            -e ADMIN_TOKEN=quality-gate-admin-token-000000000000 \
            -e PLATFORM_MASTER_KEY=quality-gate-master-key-00000000000 \
            -e MODEL_BROKER_ENABLED=false \
            -e INTERNAL_HTTP_ENABLED=false \
            "$image"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:17860/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" = 30 ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:17860/readyz \
            | grep -q '"status":"setup_required"'
