name: Deploy verified source to Hugging Face Space

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable GitHub commit SHA that passed the quality gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hf-space-${{ vars.HF_SPACE_ID }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: huggingface-space
    steps:
      - name: Check out exact deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact deployment source and settings
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse 'HEAD^{commit}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -n "${HF_SPACE_ID:-}"
          test -n "${HF_TOKEN:-}"
          [[ "$HF_SPACE_ID" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install pinned Hugging Face tooling
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'huggingface_hub==1.5.0' 'hf-transfer==0.1.9'
          npm ci --no-audit --no-fund

      - name: Verify Hugging Face SDK readback contract
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/hf-space-info-preflight.json"
          python3 scripts/hf-space-info.py "$output"
          node --input-type=module - "$output" "$HF_SPACE_ID" <<'NODE'
          import { readFileSync } from 'node:fs';
          const info = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (typeof info.id !== 'string' || info.id.toLowerCase() !== process.argv[3].toLowerCase()) {
            throw new Error(`Unexpected Space id: ${info.id}`);
          }
          if (typeof info.sha !== 'string' || !info.sha) throw new Error('Space SHA is missing');
          if (!Object.hasOwn(info, 'runtime')) throw new Error('Space runtime field is missing');
          NODE

      - name: Build production runtime
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          npm run build
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"

      - name: Package immutable artifact payload
        id: package
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/artifact"
          node scripts/package-artifact.mjs --source-sha "$SOURCE_SHA" --slot edge --out "$out_dir" \
            | tee "$RUNNER_TEMP/package-output.txt"
          sha256="$(grep '^sha256=' "$RUNNER_TEMP/package-output.txt" | cut -d= -f2)"
          bytes="$(grep '^bytes=' "$RUNNER_TEMP/package-output.txt" | cut -d= -f2)"
          manifest_uri="$(grep '^manifest_uri=' "$RUNNER_TEMP/package-output.txt" | cut -d= -f2-)"
          test -n "$sha256" && test -n "$bytes" && test -n "$manifest_uri"
          printf 'sha256=%s\nbytes=%s\nmanifest_uri=%s\n' "$sha256" "$bytes" "$manifest_uri" >> "$GITHUB_OUTPUT"

      - name: Upload artifact payload to the private distribution bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          namespace="${HF_SPACE_ID%%/*}"
          key_prefix="feishu-agent-platform/edge/${SOURCE_SHA}"
          out_dir="$RUNNER_TEMP/artifact"
          export HF_HUB_ENABLE_HF_TRANSFER=1
          hf buckets cp "$out_dir/payload.tar.gz" "hf://buckets/${namespace}/hfs-dist/${key_prefix}/payload.tar.gz"
          hf buckets cp "$out_dir/manifest.json" "hf://buckets/${namespace}/hfs-dist/${key_prefix}/manifest.json"
          node --input-type=module - "$out_dir/manifest.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (manifest.slot !== 'edge') throw new Error(`Unexpected artifact slot: ${manifest.slot}`);
          NODE

      - name: Export deterministic thin Space bundle
        id: export
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_URI: ${{ steps.package.outputs.manifest_uri }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/hf-export"
          source_time="$(git show -s --format=%cI "$SOURCE_SHA")"
          mkdir -p "$export_dir"
          git archive --format=tar "$SOURCE_SHA" hfs | tar -xf - -C "$export_dir" --strip-components=1

          test -f "$export_dir/Dockerfile"
          test -f "$export_dir/README.md"
          test -f "$export_dir/docker/entrypoint.sh"
          test -f "$export_dir/docker/artifact-bootstrap.mjs"
          test ! -e "$export_dir/.env"
          test ! -d "$export_dir/.git"
          test ! -d "$export_dir/src"
          test ! -d "$export_dir/test"
          test ! -d "$export_dir/docs"
          test ! -d "$export_dir/local"
          test ! -d "$export_dir/config"

          SOURCE_REPOSITORY="$GITHUB_REPOSITORY" SOURCE_TIME="$source_time" \
            node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const document = {
            schemaVersion: 1,
            lane: 'artifact',
            sourceRepository: process.env.SOURCE_REPOSITORY,
            sourceSha: process.env.SOURCE_SHA,
            sourceCommitTime: process.env.SOURCE_TIME,
            artifactManifest: process.env.MANIFEST_URI,
          };
          writeFileSync(
            `${process.env.RUNNER_TEMP}/hf-export/DEPLOYMENT_SOURCE.json`,
            `${JSON.stringify(document, null, 2)}\n`,
            { mode: 0o644 },
          );
          NODE

          cd "$export_dir"
          git init -b main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          GIT_AUTHOR_DATE="$source_time" GIT_COMMITTER_DATE="$source_time" \
            git commit -m "Deploy ${GITHUB_REPOSITORY}@${SOURCE_SHA}"
          hf_sha="$(git rev-parse 'HEAD^{commit}')"
          test -n "$hf_sha"
          printf 'hf_sha=%s\n' "$hf_sha" >> "$GITHUB_OUTPUT"

      - name: Initialize deployment evidence
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_HF_SHA: ${{ steps.export.outputs.hf_sha }}
          MANIFEST_URI: ${{ steps.package.outputs.manifest_uri }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/deployment-evidence"
          mkdir -p "$evidence_dir"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const directory = `${process.env.RUNNER_TEMP}/deployment-evidence`;
          const evidence = {
            schemaVersion: 1,
            lane: 'artifact',
            status: 'pending',
            sourceSha: process.env.SOURCE_SHA,
            artifactManifest: process.env.MANIFEST_URI,
            expectedHfRepositorySha: process.env.EXPECTED_HF_SHA,
            hfRepositorySha: null,
            hfRuntimeSha: null,
            stage: 'waiting_for_push',
            domainStage: 'unknown',
            http: null,
          };
          writeFileSync(`${directory}/deployment-evidence.json`, `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Push deterministic bundle to Hugging Face over HTTPS
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          EXPECTED_HF_SHA: ${{ steps.export.outputs.hf_sha }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/hf-export"
          askpass="$RUNNER_TEMP/hf-askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'hf_token' ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
            *) printf '%s\n' '' ;;
          esac
          ASKPASS
          chmod 0700 "$askpass"

          cd "$export_dir"
          git remote add huggingface "https://huggingface.co/spaces/${HF_SPACE_ID}"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push --force huggingface HEAD:main
          remote_sha="$(GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git ls-remote huggingface refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_HF_SHA"
          printf '%s\n' "$remote_sha" > "$RUNNER_TEMP/deployment-evidence/pushed-sha.txt"

      - name: Pin Space artifact variables and restart runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_URI: ${{ steps.package.outputs.manifest_uri }}
          PAYLOAD_BYTES: ${{ steps.package.outputs.bytes }}
        run: |
          set -euo pipefail
          max_bytes=$((PAYLOAD_BYTES * 2))
          if [ "$max_bytes" -lt 268435456 ]; then max_bytes=268435456; fi
          hf spaces variables add "$HF_SPACE_ID" \
            -e "FAP_ARTIFACT_MANIFEST_HF_URI=${MANIFEST_URI}" \
            -e "FAP_ARTIFACT_EXPECTED_SOURCE_REF=${SOURCE_SHA}" \
            -e "FAP_ARTIFACT_MAX_BYTES=${max_bytes}"
          hf spaces restart "$HF_SPACE_ID"

      - name: Wait for exact Space runtime and verify public plane
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          EXPECTED_HF_SHA: ${{ steps.export.outputs.hf_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANIFEST_URI: ${{ steps.package.outputs.manifest_uri }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/deployment-evidence"
          mkdir -p "$evidence_dir"
          ready=false
          paused_since=0
          readback_failures=0

          write_failure_context() {
            FAILURE_PHASE="$1" FAILURE_REASON="$2" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const directory = `${process.env.RUNNER_TEMP}/deployment-evidence`;
          const context = {
            phase: process.env.FAILURE_PHASE,
            reason: process.env.FAILURE_REASON,
          };
          writeFileSync(`${directory}/failure-context.json`, `${JSON.stringify(context, null, 2)}\n`);
          NODE
          }
          write_failure_context runtime_readback runtime_not_ready

          for attempt in $(seq 1 180); do
            info_file="$evidence_dir/space-info-latest.json"
            state_file="$evidence_dir/runtime-state-latest.json"
            if ! python3 scripts/hf-space-info.py "$info_file"; then
              readback_failures=$((readback_failures + 1))
              paused_since=0
              write_failure_context runtime_readback sdk_readback_failed
              printf 'attempt=%s consecutive_failures=%s\n' \
                "$attempt" "$readback_failures" > "$evidence_dir/readback-error-latest.txt"
              if [[ "$readback_failures" -ge 3 ]]; then
                echo 'Hugging Face SDK readback failed three consecutive times.' >&2
                exit 1
              fi
              sleep 10
              continue
            fi
            readback_failures=0
            write_failure_context runtime_evaluation runtime_evaluation_failed
            status="$(node scripts/hf-space-runtime-state.mjs \
              "$info_file" "$EXPECTED_HF_SHA" "$paused_since" "$state_file")"
            IFS=$'\t' read -r disposition reason repo_sha runtime_sha stage domain_stage subdomain paused_since paused_for_ms <<< "$status"
            write_failure_context runtime_poll "$reason"
            printf 'HF attempt=%s repo=%s runtime=%s stage=%s domain=%s decision=%s reason=%s paused_ms=%s\n' \
              "$attempt" "$repo_sha" "$runtime_sha" "$stage" "$domain_stage" \
              "$disposition" "$reason" "$paused_for_ms"

            if [[ "$disposition" = 'ready' ]]; then
              ready=true
              break
            fi
            if [[ "$disposition" = 'terminal' ]]; then
              echo "Hugging Face Space entered terminal state: stage=$stage reason=$reason" >&2
              exit 1
            fi
            sleep 10
          done
          test "$ready" = true

          write_failure_context http_smoke http_smoke_failed
          base="https://${subdomain}.hf.space"
          health_status="$(curl --silent --show-error --location --output "$evidence_dir/healthz.json" \
            --proto '=https' --proto-redir '=https' --write-out '%{http_code}' \
            --header "Authorization: Bearer ${HF_TOKEN}" "$base/healthz")"
          ready_status="$(curl --silent --show-error --location --output "$evidence_dir/readyz.json" \
            --proto '=https' --proto-redir '=https' --write-out '%{http_code}' \
            --header "Authorization: Bearer ${HF_TOKEN}" "$base/readyz")"
          admin_status="$(curl --silent --show-error --location --output "$evidence_dir/admin.html" \
            --proto '=https' --proto-redir '=https' --write-out '%{http_code}' \
            --header "Authorization: Bearer ${HF_TOKEN}" "$base/admin")"
          test "$health_status" = 200
          test "$ready_status" = 200
          test "$admin_status" = 200
          node --input-type=module - "$evidence_dir/healthz.json" "$evidence_dir/readyz.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const readiness = JSON.parse(readFileSync(process.argv[3], 'utf8'));
          if (health.status !== 'ok') throw new Error(`Unexpected health status: ${health.status}`);
          if (!['setup_required', 'ready'].includes(readiness.status)) {
            throw new Error(`Unexpected readiness status: ${readiness.status}`);
          }
          NODE
          grep -Eq 'Feishu Agent Platform|飞书' "$evidence_dir/admin.html"

          SOURCE_SHA="$SOURCE_SHA" EXPECTED_HF_SHA="$EXPECTED_HF_SHA" MANIFEST_URI="$MANIFEST_URI" \
            HEALTH_STATUS="$health_status" READY_STATUS="$ready_status" ADMIN_STATUS="$admin_status" \
            node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const directory = `${process.env.RUNNER_TEMP}/deployment-evidence`;
          const state = JSON.parse(readFileSync(`${directory}/runtime-state-latest.json`, 'utf8'));
          const evidence = {
            schemaVersion: 1,
            lane: 'artifact',
            status: 'verified',
            sourceSha: process.env.SOURCE_SHA,
            artifactManifest: process.env.MANIFEST_URI,
            expectedHfRepositorySha: process.env.EXPECTED_HF_SHA,
            hfRepositorySha: process.env.EXPECTED_HF_SHA,
            hfRuntimeSha: state.runtimeSha,
            stage: state.stage,
            domainStage: state.domainStage,
            http: {
              healthz: Number(process.env.HEALTH_STATUS),
              readyz: Number(process.env.READY_STATUS),
              admin: Number(process.env.ADMIN_STATUS),
            },
          };
          writeFileSync(`${directory}/deployment-evidence.json`, `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Finalize failed deployment evidence
        if: failure()
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_HF_SHA: ${{ steps.export.outputs.hf_sha }}
          MANIFEST_URI: ${{ steps.package.outputs.manifest_uri }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/deployment-evidence"
          mkdir -p "$evidence_dir"
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const directory = `${process.env.RUNNER_TEMP}/deployment-evidence`;
          const evidencePath = `${directory}/deployment-evidence.json`;
          const statePath = `${directory}/runtime-state-latest.json`;
          const contextPath = `${directory}/failure-context.json`;
          const pushedPath = `${directory}/pushed-sha.txt`;
          const readJsonObject = (path) => {
            if (!existsSync(path)) return {};
            try {
              const value = JSON.parse(readFileSync(path, 'utf8'));
              return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
            } catch {
              return {};
            }
          };
          const previous = readJsonObject(evidencePath);
          const state = readJsonObject(statePath);
          const context = readJsonObject(contextPath);
          const pushedSha = existsSync(pushedPath)
            ? readFileSync(pushedPath, 'utf8').trim()
            : '';
          const observedRepositorySha = pushedSha ||
            (state.repoSha && state.repoSha !== 'pending' ? state.repoSha : null);
          const evidence = {
            ...previous,
            schemaVersion: 1,
            lane: 'artifact',
            status: 'failed',
            sourceSha: process.env.SOURCE_SHA,
            artifactManifest: process.env.MANIFEST_URI || previous.artifactManifest || null,
            expectedHfRepositorySha: process.env.EXPECTED_HF_SHA ||
              previous.expectedHfRepositorySha || null,
            hfRepositorySha: observedRepositorySha,
            hfRuntimeSha: state.runtimeSha === 'pending' ? null : state.runtimeSha ?? null,
            stage: state.stage ?? previous.stage ?? 'workflow_failed',
            domainStage: state.domainStage ?? previous.domainStage ?? 'unknown',
            failurePhase: context.phase ?? (existsSync(pushedPath) ? 'post_push' : 'pre_push'),
            failureReason: context.reason ?? state.reason ?? 'workflow_step_failed',
          };
          writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-deployment-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/deployment-evidence/
          if-no-files-found: warn
          retention-days: 30
