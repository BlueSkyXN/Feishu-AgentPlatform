name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    if: github.event.repository.private == false || vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact pull-request merge source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse 'HEAD^{commit}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Review dependency changes against the pull-request base
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          show-patched-versions: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Audit the complete locked production dependency set
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=moderate
